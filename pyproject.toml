[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rssagent"
version = "0.1.0"
description = "Sports-science journal RSS monitoring and alerts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "pandas>=2.0",
    "requests>=2.31",
    "schedule>=1.2",
]

[project.scripts]
rssagent = "rssagent.monitor:main"
rssagent-api = "rssagent.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
